services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tengenezacv
      POSTGRES_USER: tengenezacv
      POSTGRES_PASSWORD: tengenezacv
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tengenezacv -d tengenezacv"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
